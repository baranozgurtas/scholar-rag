name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deterministic regression suite. No Ollama, no Qdrant, no torch, and no
# model downloads: the chain is exercised with fake retriever / reranker /
# LLM, and the committed eval results are re-analysed from JSON.
# The full model evaluation is a local command (`make eval`), see README.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check src/ tests/ eval/

      - name: Run tests
        run: pytest tests/ -m "not integration" --tb=short
        env:
          LANGFUSE_ENABLED: "false"
          LOG_LEVEL: WARNING

      - name: Legacy results re-analysis is up to date
        run: |
          python -m eval.reanalyze_legacy
          git diff --exit-code -- eval/results/legacy_reanalysis.json eval/results/legacy_reanalysis.md
